<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Veil Executor</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <div class="bg-grid"></div><div class="bg-glow"></div>

  <header class="nav">
    <a href="index.html" class="logo">
      <span class="logo-mark">V</span>
      <span class="logo-text">VEIL<span class="accent">EXECUTOR</span></span>
    </a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="downloads.html">Download</a>
      <a href="scripts.html">Scripts</a>
      <a href="dashboard.html" class="active">Dashboard</a>
      <a href="#" id="nav-auth" class="nav-cta">…</a>
    </nav>
  </header>

  <main class="wrap">
    <div id="loading" class="muted">Loading…</div>
    <div id="content" class="hidden">
      <div class="profile-card">
        <img id="pfp" class="profile-avatar" alt="avatar" />
        <div class="profile-info">
          <h1 id="pname">—</h1>
          <div class="muted mono" id="pid">—</div>
          <div class="mt-1">
            <span class="badge" id="prole">member</span>
          </div>
        </div>
        <button class="btn btn-danger" id="logout-btn">Logout</button>
      </div>

      <div class="stats-grid mt-3">
        <div class="stat-card">
          <div class="stat-num" id="stat-scripts">0</div>
          <div class="stat-lbl">Scripts Submitted</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="stat-runs">0</div>
          <div class="stat-lbl">Script Runs</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="stat-favs">0</div>
          <div class="stat-lbl">Favorites</div>
        </div>
      </div>

      <h2 class="section-title mt-3" style="font-size:20px">My submissions</h2>
      <div id="my-scripts" class="my-list"></div>
    </div>
  </main>

  <footer>
    <p>© 2026 Veil Executor.</p>
  </footer>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
