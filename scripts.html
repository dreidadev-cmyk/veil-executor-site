<body>
  <div class="bg-grid"></div><div class="bg-glow"></div>

  <header class="nav">
    <a href="index.html" class="logo">
      <span class="logo-mark">V</span>
      <span class="logo-text">VEIL<span class="accent">EXECUTOR</span></span>
    </a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="downloads.html">Download</a>
      <a href="scripts.html" class="active">Scripts</a>

      <a href="executor-health.html">Status</a>
      <a href="login.html" class="nav-cta" id="nav-auth">Login</a>
    </nav>

  <main class="wrap">
    <div class="row-between mb-3" style="flex-wrap:wrap;gap:12px">
      <div>
        <h1 class="section-title">Script Hub</h1>
        <p class="section-sub" style="margin-bottom:0">Curated scripts, verified by staff. Free to browse.</p>
      </div>
      <a href="#" class="btn btn-primary" id="submit-btn">Submit script</a>
    </div>

    <div class="hub-controls mb-3">
      <input class="input" id="search" placeholder="Search scripts…" />
      <select class="input" id="category">
        <option value="">All categories</option>
        <option value="mm2">Murder Mystery 2</option>
        <option value="bloxfruits">Blox Fruits</option>
        <option value="petsim">Pet Simulator</option>
        <option value="arsenal">Arsenal</option>
        <option value="universal">Universal</option>
        <option value="other">Other</option>
      </select>
      <select class="input" id="sort">
        <option value="recent">Most recent</option>
        <option value="popular">Most popular</option>
        <option value="featured">Featured first</option>
      </select>
    </div>

    <div id="grid" class="script-grid"></div>
  </main>
